modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

[[mixins]]
config = "supersonicflight.mixins.json"

[[mixins]]
config = "supersonicflight.client.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"

# Optional, client-side only: when present, the in-game config screen is offered through the mod
# list's Config button. Without it the mod is unchanged and that button simply does not appear.
[[dependencies.${mod_id}]]
modId = "cloth_config"
type = "optional"
versionRange = "[15,)"
